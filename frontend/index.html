<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout run under the punch-hole / gesture
         bar when installed as a standalone app on Android. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Second Coworker</title>
    <meta
      name="description"
      content="Your AI teammate that remembers every meeting, captures tasks in real time, and recalls past context exactly when you need it."
    />

    <!-- Inter, the closest well-made stand-in for the system UI face on
         non-Apple platforms. Preconnect because the font blocks first paint
         of every heading on the page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;550;600;650&display=swap"
      rel="stylesheet"
    />

    <!-- Installability: Chrome needs the manifest plus 192/512 PNG icons to
         build a WebAPK. See public/manifest.webmanifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Tints the Android status bar to match the app's own background. -->
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
